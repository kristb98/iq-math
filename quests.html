<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Math - Story Quests</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="index.html">IQ Math</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="test.html">Test</a></li>
        </ul>
    </nav>

    <main class="topic-page">
        <div class="container">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h2>🗺️ Story Quests</h2>
            <p class="test-intro">Three stages of story, then a mini-boss. Progress saves automatically.</p>

            <div class="quests" id="quests">
                <div class="quest-topline">
                    <span class="quest-count"></span>
                    <span class="quest-status"></span>
                </div>
                <div class="quest-list"></div>
                <div class="quest-panel">
                    <p class="quest-story"></p>
                    <p class="quest-question"></p>
                    <input type="text" class="quest-input" placeholder="Your answer" autocomplete="off">
                    <button type="button" class="quest-submit">Continue</button>
                    <p class="quest-feedback"></p>
                </div>
            </div>

            <div class="feature-links">
                <a href="detective.html" class="feature-link">🕵️ Math Detective</a>
                <a href="cosmetics.html" class="feature-link">🎨 Cosmetics Shop</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 IQ Math. Learn math the smart way.</p>
    </footer>

    <script src="script.js"></script>
    <script src="features.js"></script>
    <script src="extras.js"></script>
</body>
</html>
